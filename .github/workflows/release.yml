name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.5.0)"
        required: true
        default: "v1.5.0"

permissions:
  contents: write

jobs:
  linux-plasma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Plasma widgets
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          STAGE="TickerLens-linux-plasma6-${VERSION}"
          mkdir -p dist/"$STAGE"
          cp -a package news-package install.sh LICENSE NOTICE README.md SECURITY.md dist/"$STAGE"/
          chmod +x dist/"$STAGE"/install.sh
          cat > dist/"$STAGE"/INSTALL.txt << EOF
          TickerLens — Linux (KDE Plasma 6)
          =================================

          Requirements: Plasma 6 desktop

          Install:
            chmod +x install.sh
            ./install.sh

          Then: right-click desktop → Add Widgets → TickerLens / TickerLens News

          Uninstall:
            kpackagetool6 --type Plasma/Applet --remove com.github.stockglass
            kpackagetool6 --type Plasma/Applet --remove com.github.stockglass.news
          EOF
          # fix INSTALL.txt leading spaces from heredoc
          sed -i 's/^          //' dist/"$STAGE"/INSTALL.txt
          cd dist
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: linux-plasma
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build native Windows app
        shell: pwsh
        run: |
          dotnet publish windows-native/TickerLens.Native.csproj `
            -c Release -r win-x64 --self-contained true `
            -o windows-native/publish

      - name: Package portable + installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $version.TrimStart("v")

          # Stage clean portable folder
          $stageName = "TickerLens-windows-x64-$version"
          $stage = "dist/$stageName"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item windows-native/publish/TickerLens.exe $stage -Force
          Copy-Item windows/packaging/README-WINDOWS.txt $stage -Force
          Copy-Item LICENSE $stage -Force

          # Zip
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/$stageName.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name, Length, FullName

          # Build a proper per-user setup executable (no administrator prompt).
          choco install nsis -y --no-progress
          $setup = "dist/TickerLens-windows-x64-$version-setup.exe"
          makensis `
            "/DVERSION=$version" `
            "/DSTAGE_DIR=$((Resolve-Path $stage).Path)" `
            "/DAPP_ICON=$((Resolve-Path 'windows/assets/app.ico').Path)" `
            "/DOUTFILE=$((Join-Path (Resolve-Path dist).Path (Split-Path $setup -Leaf)))" `
            windows/packaging/TickerLens.nsi
          if (-not (Test-Path $setup)) { throw "Setup executable was not created" }
          Get-Item $setup | Format-List Name, Length, FullName

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/*.zip
            dist/*-setup.exe

  publish:
    needs: [linux-plasma, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        id: prep
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$VERSION" != v* ]]; then VERSION="v$VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*-setup.exe' \) -exec cp -v {} release-assets/ \;
          ls -lah release-assets/

          cat > release-notes.md << EOF
          ## TickerLens ${VERSION}

          Free frosted-glass market widgets — **KDE Plasma 6** and **Windows 11**.

          ### Windows 11
          1. Download and run **\`TickerLens-windows-x64-*-setup.exe\`**
          2. Or download the ZIP for a portable installation
          3. The app is self-contained; no Qt or .NET installation is required

          ### Linux (KDE Plasma 6)
          1. Download **\`TickerLens-linux-plasma6-*.tar.gz\`**
          2. Extract and run:
             \`\`\`bash
             chmod +x install.sh && ./install.sh
             \`\`\`
          3. Desktop → **Add Widgets** → TickerLens / TickerLens News

          ### Notes
          - Quotes & news: free public data (no key)
          - Optional AI news ratings: put DeepSeek key in app config (see README)
          - License: **GPL-3.0**

          Full docs: https://github.com/EmmanouelKontos/TickerLens
          EOF
          # strip leading spaces from heredoc
          sed -i 's/^          //' release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.version }}
          name: TickerLens ${{ steps.prep.outputs.version }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
